<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Available Jobs - Campus Career</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        Campus Career 🎓
    </div>

    <nav class="nav-links">

        <a href="index.html">Dashboard</a>

        <a href="jobs.html">Jobs</a>

        <a href="applications.html">Applications</a>

        <a href="profile.html">Profile</a>

        <a href="#" onclick="logout()">Logout</a>

    </nav>

</header>


<main class="container">

    <section class="welcome">

        <h1>
            Available Jobs 💼
        </h1>

        <p>
            Explore job opportunities and find the right match for your skills.
        </p>

    </section>


    <section class="jobs-section">

        <div id="jobsContainer">

            <p>
                Loading jobs...
            </p>

        </div>

    </section>

</main>


<script>

    const studentId =
        Number(localStorage.getItem("studentId"));


    if (!studentId) {

        window.location.href =
            "login.html";

    }


    const API_URL =
        `http://localhost:8080/api/matching/student/${studentId}`;


    async function loadJobs() {

        const container =
            document.getElementById(
                "jobsContainer"
            );


        try {

            const response =
                await fetch(API_URL);


            if (!response.ok) {

                throw new Error(
                    "Failed to load jobs"
                );

            }


            const jobs =
                await response.json();


            displayJobs(jobs);

        }

        catch (error) {

            console.error(error);

            container.innerHTML = `
            <p>
                Unable to load jobs.
                Make sure Spring Boot is running.
            </p>
        `;

        }

    }


    function displayJobs(jobs) {

        const container =
            document.getElementById(
                "jobsContainer"
            );


        container.innerHTML = "";


        if (!jobs || jobs.length === 0) {

            container.innerHTML =
                "<p>No jobs available.</p>";

            return;

        }


        jobs.forEach(job => {

            const card =
                document.createElement("div");


            card.className =
                "job-card";


            card.innerHTML = `

            <div class="job-header">

                <div>

                    <div class="job-title">

                        ${job.jobTitle}

                    </div>

                    <div class="company">

                        ${job.companyName}

                    </div>

                </div>


                <div class="match">

                    ${job.matchPercentage}% Match

                </div>

            </div>


            <div class="job-info">

                <strong>
                    Location:
                </strong>

                ${job.location || "Not specified"}

            </div>


            <div class="job-info">

                ${
                job.eligible
                    ? "✅ You are eligible"
                    : "❌ You are not eligible"
            }

            </div>


            <div class="skills">

                <strong>
                    Matched Skills:
                </strong>

                ${job.matchedSkills || "None"}

            </div>


            <div class="skills">

                <strong>
                    Missing Skills:
                </strong>

                ${job.missingSkills || "None"}

            </div>


            <div class="job-info">

                <strong>
                    Why this score?
                </strong>

                ${job.reason || "No explanation available."}

            </div>


            <button
                class="apply-btn"
                onclick="viewJob(${job.jobId})">

                View Job

            </button>

        `;


            container.appendChild(card);

        });

    }


    function viewJob(jobId) {

        window.location.href =
            `job-details.html?id=${jobId}`;

    }


    function logout() {

        localStorage.removeItem(
            "studentId"
        );

        localStorage.removeItem(
            "studentName"
        );


        window.location.href =
            "login.html";

    }


    loadJobs();

</script>

</body>

</html>
