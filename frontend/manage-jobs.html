```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Jobs - Campus Career</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        Campus Career 🎓
    </div>

    <nav class="nav-links">

        <a href="admin.html">Admin</a>

        <a href="add-job.html">Add Job</a>

        <a href="manage-jobs.html">Manage Jobs</a>

        <a href="#" onclick="logout()">Logout</a>

    </nav>

</header>


<main class="container">

    <section class="welcome">

        <h1>
            Manage Jobs 💼
        </h1>

        <p>
            View and manage all job opportunities posted by recruiters.
        </p>

    </section>


    <section class="jobs-section">

        <div id="jobsContainer">

            <p>
                Loading jobs...
            </p>

        </div>

    </section>

</main>


<script>

    // Recruiter-only page protection
    const role =
        localStorage.getItem("role");

    if (role !== "RECRUITER") {

        window.location.href =
            "index.html";

    }


    const API_URL =
        "http:///api/jobs";


    async function loadJobs() {

        const container =
            document.getElementById("jobsContainer");


        try {

            const response =
                await fetch(
                    API_URL
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load jobs"
                );

            }


            const jobs =
                await response.json();


            displayJobs(jobs);

        }

        catch (error) {

            console.error(error);

            container.innerHTML = `
                <p>
                    Unable to load jobs.
                    Make sure Spring Boot is running.
                </p>
            `;

        }

    }


    function displayJobs(jobs) {

        const container =
            document.getElementById("jobsContainer");


        container.innerHTML = "";


        if (jobs.length === 0) {

            container.innerHTML =
                "<p>No jobs found.</p>";

            return;

        }


        jobs.forEach(job => {

            const card =
                document.createElement("div");


            card.className =
                "job-card";


            card.innerHTML = `

                <div class="job-header">

                    <div>

                        <div class="job-title">
                            ${job.jobTitle}
                        </div>

                        <div class="company">
                            ${job.companyName}
                        </div>

                    </div>

                </div>


                <div class="job-info">

                    <strong>
                        Location:
                    </strong>

                    ${job.location || "Not specified"}

                </div>


                <div class="job-info">

                    <strong>
                        Minimum CGPA:
                    </strong>

                    ${job.minimumCgpa ?? "Not specified"}

                </div>


                <div class="job-info">

                    <strong>
                        Graduation Year:
                    </strong>

                    ${job.graduationYear ?? "Not specified"}

                </div>


                <div class="skills">

                    <strong>
                        Required Skills:
                    </strong>

                    ${job.skills || "Not specified"}

                </div>


                <div class="job-info">

                    <strong>
                        Description:
                    </strong>

                    ${job.description || "No description"}

                </div>


                <div class="job-info">

                    <strong>
                        Job ID:
                    </strong>

                    ${job.id}

                </div>


                <div style="margin-top: 15px;">

                    <button
                        class="edit-btn"
                        onclick="editJob(${job.id})">

                        Edit Job

                    </button>


                    <button
                        class="delete-btn"
                        onclick="deleteJob(${job.id})">

                        Delete Job

                    </button>

                </div>

            `;


            container.appendChild(card);

        });

    }


    function editJob(jobId) {

        window.location.href =
            `edit-job.html?id=${jobId}`;

    }


    async function deleteJob(jobId) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this job?"
            );


        if (!confirmDelete) {

            return;

        }


        try {

            const response =
                await fetch(
                    `${API_URL}/${jobId}`,
                    {
                        method: "DELETE",

                        credentials: "include"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to delete job"
                );

            }


            alert(
                "Job deleted successfully! 🗑️"
            );


            loadJobs();

        }

        catch (error) {

            console.error(error);

            alert(
                "Unable to delete job."
            );

        }

    }


    function logout() {

        localStorage.removeItem(
            "studentId"
        );

        localStorage.removeItem(
            "studentName"
        );

        localStorage.removeItem(
            "role"
        );

        window.location.href =
            "login.html";

    }


    loadJobs();

</script>

</body>

</html>
