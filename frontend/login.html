<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Campus Career</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .login-container {
            max-width: 450px;
            margin: 80px auto;
            padding: 35px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
        }

        .login-container h1 {
            margin-bottom: 10px;
        }

        .login-container p {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .login-container label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .login-container input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>Campus Career 🎓</h1>

    <p>
        Login to find jobs that match your profile.
    </p>

    <form id="loginForm">

        <label>Email</label>

        <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
        >

        <label>Password</label>

        <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
        >

        <button
                type="submit"
                class="login-btn">
            Login
        </button>

    </form>

    <div id="message"></div>

</div>

<script>

    document.getElementById("loginForm")
        .addEventListener("submit", login);


    async function login(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");

        message.textContent =
            "Checking login...";

        try {

            const response =
                await fetch(
                    "https://campus-career-backend-n9s9.onrender.com/api/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },
                        credentials: "include",
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                message.textContent =
                    data.message ||
                    "Invalid email or password.";

                return;
            }

            localStorage.setItem(
                "studentId",
                data.studentId
            );

            localStorage.setItem(
                "studentName",
                data.name
            );

            localStorage.setItem(
                "role",
                data.role
            );

            message.textContent =
                "Login successful! 🎉";

            setTimeout(function () {

                if (data.role === "RECRUITER") {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "index.html";
                }

            }, 500);

        } catch (error) {

            console.error(error);

            message.textContent =
                "Unable to connect to server.";
        }
    }

</script>

</body>

</html>
