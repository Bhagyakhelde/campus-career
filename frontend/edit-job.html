
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Job - Campus Career</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        Campus Career 🎓
    </div>

    <nav class="nav-links">

        <a href="admin.html">Admin</a>
        <a href="add-job.html">Add Job</a>
        <a href="manage-jobs.html">Manage Jobs</a>
        <a href="#" onclick="logout()">Logout</a>

    </nav>

</header>


<main class="container">

    <section class="welcome">

        <h1>
            Edit Job ✏️
        </h1>

        <p>
            Update the job details below.
        </p>

    </section>


    <section class="jobs-section">

        <form id="editJobForm">

            <div class="form-row">

                <div class="form-group">

                    <label for="companyName">
                        Company Name
                    </label>

                    <input
                            type="text"
                            id="companyName"
                            required>

                </div>


                <div class="form-group">

                    <label for="jobTitle">
                        Job Title
                    </label>

                    <input
                            type="text"
                            id="jobTitle"
                            required>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

                    <input
                            type="text"
                            id="location"
                            required>

                </div>


                <div class="form-group">

                    <label for="minimumCgpa">
                        Minimum CGPA
                    </label>

                    <input
                            type="number"
                            id="minimumCgpa"
                            step="0.1"
                            min="0"
                            max="10"
                            required>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="graduationYear">
                        Graduation Year
                    </label>

                    <input
                            type="number"
                            id="graduationYear"
                            required>

                </div>


                <div class="form-group">

                    <label for="skills">
                        Required Skills
                    </label>

                    <input
                            type="text"
                            id="skills"
                            placeholder="Java, Spring Boot, SQL"
                            required>

                    <small>
                        Separate multiple skills with commas.
                    </small>

                </div>

            </div>


            <div class="form-group">

                <label for="description">
                    Job Description
                </label>

                <textarea
                        id="description"
                        rows="5"
                        placeholder="Enter job description..."
                        required></textarea>

            </div>


            <button
                    type="submit"
                    class="apply-btn">

                Update Job

            </button>


            <p id="message"></p>

        </form>

    </section>

</main>


<script>

    const role =
        localStorage.getItem("role");


    if (role !== "RECRUITER") {

        window.location.href =
            "index.html";

    }


    const API_URL =
        "http:///api/jobs";


    const params =
        new URLSearchParams(
            window.location.search
        );


    const jobId =
        params.get("id");


    if (!jobId) {

        document.getElementById(
            "message"
        ).textContent =
            "Job ID is missing.";

    } else {

        loadJob();

    }


    async function loadJob() {

        try {

            const response =
                await fetch(
                    `${API_URL}/${jobId}`
                );


            if (!response.ok) {

                throw new Error(
                    "Job not found"
                );

            }


            const job =
                await response.json();


            document.getElementById(
                "companyName"
            ).value =
                job.companyName || "";


            document.getElementById(
                "jobTitle"
            ).value =
                job.jobTitle || "";


            document.getElementById(
                "location"
            ).value =
                job.location || "";


            document.getElementById(
                "minimumCgpa"
            ).value =
                job.minimumCgpa ?? "";


            document.getElementById(
                "graduationYear"
            ).value =
                job.graduationYear ?? "";


            document.getElementById(
                "skills"
            ).value =
                job.skills || "";


            document.getElementById(
                "description"
            ).value =
                job.description || "";

        }

        catch (error) {

            console.error(error);

            document.getElementById(
                "message"
            ).textContent =
                "Unable to load job.";

        }

    }


    document.getElementById(
        "editJobForm"
    ).addEventListener(
        "submit",
        updateJob
    );


    async function updateJob(event) {

        event.preventDefault();


        const updatedJob = {

            companyName:
            document.getElementById(
                "companyName"
            ).value,

            jobTitle:
            document.getElementById(
                "jobTitle"
            ).value,

            location:
            document.getElementById(
                "location"
            ).value,

            minimumCgpa:
                Number(
                    document.getElementById(
                        "minimumCgpa"
                    ).value
                ),

            graduationYear:
                Number(
                    document.getElementById(
                        "graduationYear"
                    ).value
                ),

            skills:
            document.getElementById(
                "skills"
            ).value,

            description:
            document.getElementById(
                "description"
            ).value

        };


        const message =
            document.getElementById(
                "message"
            );


        message.textContent =
            "Updating job...";


        try {

            const response =
                await fetch(
                    `${API_URL}/${jobId}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials: "include",

                        body:
                            JSON.stringify(
                                updatedJob
                            )
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to update job"
                );

            }


            message.textContent =
                "Job updated successfully! 🎉";


            setTimeout(function () {

                window.location.href =
                    "manage-jobs.html";

            }, 1000);

        }

        catch (error) {

            console.error(error);

            message.textContent =
                "Unable to update job.";

        }

    }


    function logout() {

        localStorage.removeItem("studentId");
        localStorage.removeItem("studentName");
        localStorage.removeItem("role");

        window.location.href =
            "login.html";

    }

</script>

</body>

</html>
